# Integração contínua do FHDOD (Seção 13 da especificação).
# Escopo da ET01: segredos, formatação, lint, typecheck, testes, build, saúde da API e
# auditoria de dependências. PostgreSQL 17, `prisma migrate deploy` e `migrate diff` serão
# adicionados na ET02, quando existirem migrations.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verificado)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${file}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${file}$" | sha256sum -c -
          tar -xzf "${file}" gitleaks

      - name: Verificar histórico do Git
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  qualidade:
    name: Formatação, lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (backend e frontend)
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm run test

      - name: Build (backend e frontend)
        run: npm run build

      - name: Verificar GET /api/v1/health com o build do backend
        working-directory: backend
        env:
          NODE_ENV: production
          PORT: '3333'
          CORS_ORIGIN: https://fhdod.example
          LOG_LEVEL: warn
        run: |
          node dist/server.js &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3333/api/v1/health -o health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"status":"ok"' health.json

  dependencias:
    name: Auditoria de dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Política: falha com vulnerabilidades de severidade alta ou crítica.
      - name: npm audit
        run: npm audit --audit-level=high
