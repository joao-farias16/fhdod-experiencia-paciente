# Integração contínua do FHDOD (Seção 13 da especificação; Tabela 26).
# ET01: segredos, formatação, lint, typecheck, testes, build, saúde da API e auditoria de dependências.
# Etapa 2 (separação): o repositório contém somente a API (backend); o frontend tem CI própria.
# Etapa 3 (MySQL): banco MySQL 8.4 LTS como serviço da CI; migrations SQL de database/migrations
# aplicadas em banco vazio, conferência do database/schema.sql, seed de demonstração com
# verificação das contagens e testes de integração (MySQL real, autenticação própria, T12–T37 e
# T32). Prisma, Supabase e PostgreSQL não são mais usados.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verificado)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${file}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${file}$" | sha256sum -c -
          tar -xzf "${file}" gitleaks

      - name: Verificar histórico do Git
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  qualidade:
    name: API — formatação, lint, typecheck, banco MySQL, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          # Banco descartável do serviço da CI (credenciais públicas, sem dados reais).
          MYSQL_ROOT_PASSWORD: fhdod_ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pfhdod_ci_root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: fhdod_ci_root # gitleaks:allow — senha do contêiner descartável da CI
      DB_NAME: fhdod
      TEST_DB_NAME: fhdod_test
      SEED_ALLOW_REMOTE: 'false'
      # Senha fictícia das contas @example.com do seed (somente neste banco descartável).
      SEED_DEMO_PASSWORD: DemoCi2026 # gitleaks:allow — valor fictício
      SEED_REFERENCE_DATE: '2026-11-05'
      BCRYPT_ROUNDS: '10'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Versão do MySQL do serviço
        run: mysql -h 127.0.0.1 -uroot -p"$DB_PASSWORD" -e "SELECT VERSION();"

      - name: Conferir database/schema.sql × migrations
        run: npm run db:schema:check

      - name: Criar o banco e aplicar as migrations em banco vazio
        run: |
          npm run db:create
          npm run db:migrate
          npm run db:migrate:status

      - name: Importar database/schema.sql num banco novo (mesmo fluxo do MySQL Workbench)
        run: |
          mysql -h 127.0.0.1 -uroot -p"$DB_PASSWORD" -e "CREATE DATABASE fhdod_workbench CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_as_cs;"
          sed 's/^USE fhdod;/USE fhdod_workbench;/' database/schema.sql | mysql -h 127.0.0.1 -uroot -p"$DB_PASSWORD"
          mysql -h 127.0.0.1 -uroot -p"$DB_PASSWORD" fhdod_workbench < database/seeds/001_dados_base.sql
          DB_NAME=fhdod_workbench npm run db:migrate:status

      - name: Seed de demonstração e verificação das contagens
        run: |
          npm run db:seed
          npm run db:seed:verify

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (Vitest; integração com MySQL real no banco TEST_DB_NAME)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verificar login e GET /api/v1/health com o build da API
        env:
          NODE_ENV: production
          PORT: '3333'
          CORS_ORIGIN: https://fhdod.example
          LOG_LEVEL: warn
          # Valores fictícios só para a validação do ambiente de produção.
          JWT_SECRET: segredo-ficticio-da-ci-para-os-tokens-jwt # gitleaks:allow — valor fictício
          AUDIT_IP_SECRET: valor-ficticio-da-ci-com-mais-de-32-caracteres # gitleaks:allow — valor fictício
          PUBLIC_APP_URL: https://fhdod.example
          MANIFESTATION_TOKEN_SECRET: token-ficticio-da-ci-com-mais-de-32-caracteres # gitleaks:allow — valor fictício
        run: |
          node dist/server.js &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3333/api/v1/health -o health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"status":"ok"' health.json
          status=$(curl -s -o login.json -w '%{http_code}' -X POST http://localhost:3333/api/v1/auth/login             -H 'Content-Type: application/json'             -d "{\"email\":\"superadmin@example.com\",\"password\":\"$SEED_DEMO_PASSWORD\"}")
          test "$status" = "200"
          grep -q '"accessToken"' login.json

  dependencias:
    name: Auditoria de dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Política: falha com vulnerabilidades de severidade alta ou crítica.
      - name: npm audit
        run: npm audit --audit-level=high
